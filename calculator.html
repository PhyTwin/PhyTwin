<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>在线计算器 | PhyTwin</title>
  <meta name="description" content="PhyTwin 在线计算器：表达式计算、单位换算、物理常用公式。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-calc">
  <div class="atmosphere atmosphere-dim" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html">PhyTwin</a>
    <nav class="nav">
      <a href="products.html">工作台</a>
      <a href="calculator.html" aria-current="page">计算器</a>
      <a href="docs/deploy.html">部署</a>
    </nav>
  </header>

  <main class="calc-main">
    <header class="page-intro">
      <p class="eyebrow">Online Calculator</p>
      <h1>在线计算器</h1>
      <p>在浏览器里直接算，无需后端。可切换科学表达式、单位换算与常用物理公式。</p>
    </header>

    <div class="calc-layout">
      <section class="panel calc-shell" aria-label="计算器">
        <div class="calc-tabs" role="tablist">
          <button type="button" class="calc-tab is-active" data-tab="expr" role="tab" aria-selected="true">表达式</button>
          <button type="button" class="calc-tab" data-tab="unit" role="tab" aria-selected="false">单位换算</button>
          <button type="button" class="calc-tab" data-tab="phys" role="tab" aria-selected="false">物理公式</button>
        </div>

        <div class="calc-pane is-active" data-pane="expr">
          <label class="sr-only" for="expr-input">表达式</label>
          <input id="expr-input" class="calc-display" type="text" inputmode="decimal" placeholder="例如 2*pi*sqrt(9.8/1.2)" autocomplete="off" spellcheck="false" />
          <div class="calc-keys" id="expr-keys">
            <button type="button" data-k="(">(</button>
            <button type="button" data-k=")">)</button>
            <button type="button" data-k="^">^</button>
            <button type="button" class="key-muted" data-action="back">⌫</button>
            <button type="button" data-k="7">7</button>
            <button type="button" data-k="8">8</button>
            <button type="button" data-k="9">9</button>
            <button type="button" data-k="/">÷</button>
            <button type="button" data-k="4">4</button>
            <button type="button" data-k="5">5</button>
            <button type="button" data-k="6">6</button>
            <button type="button" data-k="*">×</button>
            <button type="button" data-k="1">1</button>
            <button type="button" data-k="2">2</button>
            <button type="button" data-k="3">3</button>
            <button type="button" data-k="-">−</button>
            <button type="button" data-k="0">0</button>
            <button type="button" data-k=".">.</button>
            <button type="button" data-k="pi">π</button>
            <button type="button" data-k="+">+</button>
            <button type="button" data-fn="sqrt">√</button>
            <button type="button" data-fn="sin">sin</button>
            <button type="button" data-fn="cos">cos</button>
            <button type="button" data-fn="ln">ln</button>
            <button type="button" class="key-muted" data-action="clear">C</button>
            <button type="button" class="key-eq" data-action="eval">=</button>
          </div>
          <p class="hint" id="expr-hint">支持 + − × ÷ ^、括号，以及 sin cos tan ln log sqrt abs、pi e。</p>
        </div>

        <div class="calc-pane" data-pane="unit" hidden>
          <label>
            类别
            <select id="unit-category"></select>
          </label>
          <div class="row">
            <label>
              数值
              <input id="unit-value" type="number" step="any" value="1" />
            </label>
            <label>
              从
              <select id="unit-from"></select>
            </label>
          </div>
          <label>
            到
            <select id="unit-to"></select>
          </label>
          <button class="btn btn-primary" type="button" id="unit-convert">换算</button>
          <p class="hint" id="unit-hint">选择单位后点击换算。</p>
        </div>

        <div class="calc-pane" data-pane="phys" hidden>
          <label>
            公式
            <select id="phys-formula"></select>
          </label>
          <div id="phys-fields" class="phys-fields"></div>
          <button class="btn btn-primary" type="button" id="phys-run">计算</button>
          <p class="hint" id="phys-hint">选择公式并填写参数。</p>
        </div>
      </section>

      <aside class="panel result-panel">
        <h2>结果</h2>
        <pre id="calc-result">等待输入…</pre>
        <h2 class="subhead">历史</h2>
        <ul class="history" id="calc-history"></ul>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <span>PhyTwin Calculator</span>
    <a href="products.html">返回产品页</a>
  </footer>

  <script src="js/calculator.js"></script>
</body>
</html>
