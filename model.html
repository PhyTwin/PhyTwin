<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图纸转模型 | PhyTwin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/studio.css" />
</head>
<body class="studio-page">
  <header class="studio-header">
    <a class="studio-brand" href="products.html">PhyTwin <small>Img2Model</small></a>
    <nav class="studio-nav">
      <a href="plot3d.html">3D 绘图</a>
      <a href="model.html" aria-current="page">图纸转模型</a>
      <a href="stability.html">力学</a>
      <a href="products.html">工作台</a>
    </nav>
  </header>

  <div class="studio-layout">
    <aside class="studio-input">
      <h1 class="studio-title">图纸 / 图片转 3D</h1>
      <p class="studio-sub">上传图片生成高度场网格，可旋转、剖切、点击部件查看属性（类似 em-field 交互模型）。</p>

      <label class="upload-zone" id="upload-zone">
        <input id="file-input" type="file" accept="image/*" />
        点击或拖拽上传图片 / 图纸
      </label>

      <div class="studio-field">
        <label>高度缩放</label>
        <input id="height-scale" type="range" min="0.05" max="2" step="0.05" value="0.6" />
      </div>
      <div class="studio-field">
        <label>网格分辨率</label>
        <input id="mesh-res" type="range" min="32" max="128" step="8" value="64" />
      </div>
      <div class="model-slider-row">
        <label>剖解视图 <span id="clip-val">0%</span></label>
        <input id="clip-slider" type="range" min="0" max="100" value="0" />
      </div>
      <div class="studio-field">
        <label>
          <input id="show-wire" type="checkbox" /> 显示线框
        </label>
      </div>
      <button class="studio-btn studio-btn-primary" type="button" id="btn-rebuild">重建模型</button>
      <p class="studio-status" id="model-status">等待上传…</p>
    </aside>

    <main class="studio-output" style="padding:0.75rem;">
      <div class="model-viewport" id="model-viewport">
        <div class="model-hud">
          <div class="model-tip">左键旋转 · 右键平移 · 滚轮缩放 · 点击模型查看详情</div>
          <div class="model-info" id="model-info">
            <strong id="info-title">部件</strong>
            <p id="info-desc" style="margin:0.35rem 0 0;font-size:0.82rem;color:#5c6b7a;"></p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="js/model-viewer.js"></script>
</body>
</html>
