<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>力学稳定性 | PhyTwin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/studio.css" />
</head>
<body class="studio-page">
  <header class="studio-header">
    <a class="studio-brand" href="products.html">PhyTwin <small>Stability</small></a>
    <nav class="studio-nav">
      <a href="stability.html" aria-current="page">力学</a>
      <a href="thermal.html">热场</a>
      <a href="wind.html">风场</a>
      <a href="products.html">工作台</a>
    </nav>
  </header>

  <div class="studio-layout">
    <aside class="studio-input">
      <h1 class="studio-title">力学稳定性设计台</h1>
      <p class="studio-sub">参数化静力与欧拉屈曲估算；可调几何、材料与载荷，实时可视化应力与安全系数。</p>

      <label class="studio-field full">
        预设案例
        <select id="preset">
          <option value="beam">悬臂梁演示</option>
          <option value="column">压杆屈曲</option>
          <option value="plate">薄板弯曲</option>
        </select>
      </label>

      <div class="studio-tabs">
        <button type="button" class="studio-tab is-active" data-tab="geom">几何材料</button>
        <button type="button" class="studio-tab" data-tab="load">载荷边界</button>
      </div>

      <div id="pane-geom">
        <div class="studio-field-grid">
          <div class="studio-field"><label>E (GPa)</label><input id="p-E" type="number" step="any" value="200" /></div>
          <div class="studio-field"><label>σ_y (MPa)</label><input id="p-sy" type="number" step="any" value="250" /></div>
          <div class="studio-field"><label>L (m)</label><input id="p-L" type="number" step="any" value="2" /></div>
          <div class="studio-field"><label>b (m)</label><input id="p-b" type="number" step="any" value="0.08" /></div>
          <div class="studio-field"><label>h (m)</label><input id="p-h" type="number" step="any" value="0.12" /></div>
          <div class="studio-field"><label>ν</label><input id="p-nu" type="number" step="any" value="0.3" /></div>
        </div>
      </div>

      <div id="pane-load" hidden>
        <div class="studio-field-grid">
          <div class="studio-field"><label>F (kN)</label><input id="p-F" type="number" step="any" value="15" /></div>
          <div class="studio-field"><label>K (有效长度)</label><input id="p-K" type="number" step="any" value="1" /></div>
          <div class="studio-field"><label>边界</label>
            <select id="p-bc">
              <option value="fixed-free">固定-自由</option>
              <option value="pinned-pinned">铰支-铰支</option>
              <option value="fixed-fixed">固定-固定</option>
            </select>
          </div>
        </div>
      </div>

      <button class="studio-btn studio-btn-primary" type="button" id="btn-run">运行稳定性求解</button>
      <button class="studio-btn studio-btn-secondary" type="button" id="btn-clear">清除结果</button>
      <p class="studio-status" id="run-status">等待计算</p>
    </aside>

    <main class="studio-output">
      <div class="studio-metrics" id="metrics">
        <div class="studio-metric"><span>应力 σ</span><strong id="m-sigma">—</strong></div>
        <div class="studio-metric"><span>安全系数 SF</span><strong id="m-sf">—</strong></div>
        <div class="studio-metric"><span>临界载荷 P_cr</span><strong id="m-pcr">—</strong></div>
        <div class="studio-metric"><span>稳定判定</span><strong id="m-stable">—</strong></div>
        <div class="studio-metric"><span>求解耗时</span><strong id="m-time">—</strong></div>
      </div>

      <div class="studio-chart-grid">
        <div class="studio-card">
          <div class="studio-card-head">沿长度应力分布 σ(x)</div>
          <div class="studio-canvas-wrap"><canvas id="chart-stress" width="480" height="260"></canvas></div>
        </div>
        <div class="studio-card">
          <div class="studio-card-head">挠度曲线 w(x)</div>
          <div class="studio-canvas-wrap"><canvas id="chart-deflect" width="480" height="260"></canvas></div>
        </div>
        <div class="studio-card">
          <div class="studio-card-head">屈曲模态示意</div>
          <div class="studio-canvas-wrap"><canvas id="chart-mode" width="480" height="260"></canvas></div>
        </div>
        <div class="studio-card">
          <div class="studio-card-head">参数敏感性 SF(L)</div>
          <div class="studio-canvas-wrap"><canvas id="chart-scan" width="480" height="260"></canvas></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/chart2d.js"></script>
  <script src="js/stability.js"></script>
</body>
</html>
