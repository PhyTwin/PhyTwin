<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LocalSolver 试算 | PhyTwin</title>
  <meta name="description" content="PhyTwin 本地计算试算台。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-workbench">
  <div class="atmosphere atmosphere-dim" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html">PhyTwin</a>
    <nav class="nav">
      <a href="products.html">工作台</a>
      <a href="workbench.html" aria-current="page">试算</a>
      <a href="docs/deploy.html">部署</a>
    </nav>
  </header>

  <main class="workbench">
    <header class="page-intro">
      <p class="eyebrow">LocalSolver</p>
      <h1>本地计算试算台</h1>
      <p>默认请求本机 <code>http://127.0.0.1:8787</code>。挂到公网后，把 API 地址改成 Tunnel 域名即可。</p>
    </header>

    <form class="panel" id="compute-form">
      <label>
        API 地址
        <input id="api-base" type="url" value="http://127.0.0.1:8787" autocomplete="off" />
      </label>
      <label>
        API Key（可选）
        <input id="api-key" type="password" placeholder="本地默认 phytwin-dev" autocomplete="off" />
      </label>
      <div class="row">
        <label>
          a
          <input id="param-a" type="number" step="any" value="2" required />
        </label>
        <label>
          b
          <input id="param-b" type="number" step="any" value="3" required />
        </label>
      </div>
      <label>
        模式
        <select id="param-mode">
          <option value="sum">求和 a + b</option>
          <option value="product">乘积 a × b</option>
          <option value="hypot">斜边 √(a²+b²)</option>
        </select>
      </label>
      <button class="btn btn-primary" type="submit">提交计算</button>
      <p class="hint" id="status">尚未请求。先在本机运行 <code>python local-api/server.py</code>。</p>
    </form>

    <section class="panel result-panel" aria-live="polite">
      <h2>结果</h2>
      <pre id="result">等待提交…</pre>
    </section>
  </main>

  <footer class="site-footer">
    <span>PhyTwin LocalSolver</span>
    <a href="products.html">返回产品页</a>
  </footer>

  <script src="js/workbench.js"></script>
</body>
</html>
